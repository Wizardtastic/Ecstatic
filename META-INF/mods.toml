modLoader = "javafml" #mandatory
loaderVersion = "[47,)" #mandatory This is typically bumped every Minecraft version by Forge. See https://files.minecraftforge.net/ for a list of versions.
license = "CC-BY-NC-SA-4.0" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "ecstatic" #mandatory
version = "1.3.0" #mandatory
displayName = "Ecstatic" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://mcforge.readthedocs.io/en/latest/gettingstarted/autoupdate/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
logoFile = "ecstatic.png" #optional (needs to be in the root of your mod jar (root of your 'resources' folder))
credits = "" #optional
authors = "angryalchemist" #optional
description = '''Massive render-distance terrain LOD via surface-only generation and custom flat storage, without external pregen tools.''' #mandatory (Supports multiline text)
# Non-mandatory, and on a deliberately wide range - this is what lets one jar serve both Forge and
# NeoForge's 1.20.1 line. Two separate things had to give:
#
#   1. The range. See forge_dependency_version_range in gradle.properties - NeoForge 1.20.1 stops at
#      47.1.106, so the old "[47.2.30,)" (which just reused the compile-against version) rejected
#      every NeoForge build on the number alone.
#   2. mandatory. Modern NeoForge identifies itself as "neoforge" rather than "forge"; it is not
#      settled which of the two the 1.20.1 line reports, and that line is archived, so it cannot be
#      confirmed from a live source. Mandatory would hard-fail on load if it turns out to be
#      "neoforge" - a missing optional dependency is simply skipped, while a present one is still
#      version-checked exactly as before. So real Forge keeps its guarantee and NeoForge is not
#      locked out by a name this mod never actually depends on.
#
# What genuinely guards compatibility is the minecraft dependency below, which is unchanged: this
# mod's real requirement is a Minecraft version, not a particular loader fork. Nothing in the code
# touches Forge-only API beyond the RenderLevelStageEvent hook, which the 1.20.1 fork shares.
[[dependencies.ecstatic]] #optional
modId = "forge" #mandatory
mandatory = false #mandatory
versionRange = "[47,)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.ecstatic]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1, 1.22)"
ordering = "NONE"
side = "BOTH"
